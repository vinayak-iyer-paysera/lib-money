name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  phpunit:
    name: Run tests on ${{ matrix.php-version }} with ${{ matrix.dependency-versions }} dependencies
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version:
          - '7.0'
          - '7.1'
          - '7.2'
          - '7.3'
          - '7.4'
          - '8.0'
          - '8.1'
          - '8.2'
          - '8.3'
          - '8.4'
        dependency-versions:
          - 'lowest'
          - 'highest'
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}

      # Newer Composer refuses to install packages with a security advisory by default. Every PHPUnit release below 8.5.52
      # and 9.6.0-9.6.32 has one (CVE-2026-24765), and so do the symfony/validator releases the lowest dependencies and the
      # PHP 8.0 job install (2.0.4, 6.0.19). On PHP 7.2 no allowed PHPUnit is left (9.6.33 needs PHP 7.3), and the other
      # jobs would silently test newer versions than they are meant to. This only affects the test install here.
      # PHP 7.0 and 7.1 get Composer 2.2, which does not block advisories and does not know this setting.
      - name: Allow packages with security advisories
        if: matrix.php-version != '7.0' && matrix.php-version != '7.1'
        run: composer config policy.advisories.block false

      - name: Install dependencies
        uses: ramsey/composer-install@v2
        with:
          dependency-versions: ${{ matrix.dependency-versions }}

      - name: Run tests
        run: ./bin/phpunit
